name: Deploy Frontend

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Rebuild Frontend
        run: |
          echo "Updating frontend at /home/admin/sqlfront/sql-frontend..."
          cd /home/admin/sqlfront/sql-frontend
          git fetch origin
          git reset --hard origin/main
          
          echo "Rebuilding frontend container..."
          cd /home/admin/sqlfront/sql-backend
          docker compose up -d --build frontend || docker-compose up -d --build frontend
