name: Deploy Frontend

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Rebuild and restart frontend container
        run: |
          if [ -d "../sql-backend" ]; then
            cd ../sql-backend
            docker compose up -d --build frontend || docker-compose up -d --build frontend
          fi
